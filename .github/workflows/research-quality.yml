
name: Research Quality Assurance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-quality:
    name: Python 3.11 Research Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock.txt
          python -m pip check

      - name: Compile Python modules
        run: |
          python -m compileall -q src tests

      - name: Verify research configuration and dependencies
        run: |
          python -m src.pipeline.research_quality

      - name: Verify deterministic spatial partitioning
        run: |
          python -m pytest tests/test_spatial_split.py -k deterministic -q

      - name: Run full regression suite and enforce coverage
        run: |
          python -m pytest --cov=src --cov-branch --cov-fail-under=85 --cov-report=term-missing -q
